
<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 30px;
        }
        .container {
            max-width: 450px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0001;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button, a {
            display: inline-block;
            padding: 11px 16px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }
        a { background: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Edit Student Details</h2>

        <form method="POST">
            <label>Name</label>
            <input type="text" name="name"
                   value="{{ student.name }}" required>

            <label>Roll Number</label>
            <input type="text" name="roll"
                   value="{{ student.roll }}" required>

            <label>Course</label>
            <input type="text" name="course"
                   value="{{ student.course }}" required>

            <button type="submit">Update Student</button>
            <a href="{{ url_for('home') }}">Cancel</a>
        </form>
    </div>
</body>
</html>
